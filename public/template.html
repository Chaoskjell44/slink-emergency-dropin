<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#181818">
<title>{{title}}</title>
<style>
:root {
  color-scheme: dark;
  --bg: #181818;
  --ink: #f1f1f1;
  --body: #c9c9c9;
  --muted: #929292;
  --line: #333333;
  --accent: {{accent_color}};
  --sans: "Helvetica Neue", "Segoe UI", Helvetica, Arial, system-ui, sans-serif;
  --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: clamp(28px, 6vw, 64px) 20px;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  text-align: center;
}
main { width: min(1000px, 100%); }
.kicker {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  margin: 0 0 26px;
  font: 11px/1.4 var(--mono);
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--muted);
}
.kicker::before {
  content: "";
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
}
h1 {
  margin: 0 0 24px;
  font-size: clamp(36px, 7vw, 56px);
  line-height: 1.05;
  letter-spacing: -.035em;
  font-weight: 600;
  text-wrap: balance;
}
.lede {
  max-width: 940px;
  margin: 0 auto 18px;
  font-size: clamp(16px, 2vw, 19px);
  line-height: 1.65;
  color: var(--body);
  text-wrap: pretty;
}
.critical {
  color: var(--accent);
  font-weight: 700;
  letter-spacing: .02em;
}
code {
  font-family: var(--mono);
  background: rgba(255, 255, 255, .08);
  padding: .1em .35em;
  border-radius: 4px;
  font-size: .9em;
}
.rule {
  width: 54px;
  height: 1px;
  margin: clamp(30px, 5vw, 44px) auto;
  background: var(--line);
}
.timer-label {
  margin: 0 0 10px;
  font: 10px/1.4 var(--mono);
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--muted);
}
.status-big {
  margin: 0;
  font-size: clamp(30px, 5.5vw, 46px);
  line-height: 1.1;
  letter-spacing: -.03em;
  font-weight: 600;
  text-wrap: balance;
}
.timer-note {
  max-width: 470px;
  margin: 14px auto 0;
  font-size: 13px;
  line-height: 1.65;
  color: var(--muted);
}
.source {
  margin: 12px 0 0;
  font: 12px/1.6 var(--mono);
}
.source a {
  color: var(--ink);
  text-decoration: underline;
  text-decoration-color: var(--accent);
  text-underline-offset: .18em;
}
.source a:hover { color: var(--accent); }
.foot {
  margin: 30px auto 0;
  max-width: 520px;
  font-size: 13px;
  line-height: 1.7;
  color: var(--muted);
}
.release-line { white-space: nowrap; }
@media (max-width: 980px) { .release-line { white-space: normal; } }
@media (max-width: 560px) {
  h1 { font-size: clamp(34px, 11vw, 48px); }
  .lede { font-size: 16px; }
}
</style>
</head>
<body>
<main>
  <p class="kicker">Maintenance &middot; {{domain}}</p>
  <h1>{{h1_text}}</h1>
  <p class="lede">{{lede_paragraph_1}}</p>
  <p class="lede release-line">{{lede_paragraph_2}}</p>
  <p class="lede">{{lede_paragraph_3}}</p>

  <div class="rule" aria-hidden="true"></div>

  <p class="timer-label">{{status_label}}</p>
  <p class="status-big">{{status_big}}</p>
  <p class="timer-note">{{timer_note}}</p>
  <p class="source"><a href="{{source_url}}" target="_blank" rel="noopener noreferrer">{{source_text}}</a></p>

  <p class="foot">{{foot_text}}</p>
</main>
</body>
</html>
